name: Publish PluginMaster
on:
  workflow_dispatch:
  push: { branches: [main] }
  schedule: [{ cron: "23 * * * *" }]
  repository_dispatch:
    types: [plugin-released]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m unittest -v
      - run: python generate_pluginmaster.py
        env: { GITHUB_TOKEN: "${{ secrets.PLUGIN_READ_TOKEN }}" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
